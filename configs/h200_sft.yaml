# Instruction-tune the H200 model, warm-started from the pretrained checkpoint:
#   python -m training.train --config configs/h200_sft.yaml --init-from runs/h200_pretrain
#
# The `model:` block MUST match configs/h200_pretrain.yaml exactly and it reuses the
# same tokenizer (train.tokenizer_path) so the vocab lines up — otherwise --init-from
# raises a shape/vocab mismatch.

model:
  vocab_size: 32768
  d_model: 2048
  n_layers: 24
  full_attn_period: 4
  gdn_num_heads: 16
  gdn_head_k_dim: 128
  gdn_head_v_dim: 128
  gdn_chunk_size: 64
  gdn_conv_size: 4
  gdn_expanded_erase: false
  mla_num_q_heads: 16
  mla_num_kv_heads: 2
  mla_head_dim: 128
  max_seq_len: 4096
  moe_d_ff: 1408
  moe_n_routed: 16
  moe_n_shared: 1
  moe_top_k: 6
  compute_dtype: bfloat16

data:
  task: sft
  sources:
    - repo: OpenCoder-LLM/opc-sft-stage1
      name: realuser_instruct
      split: train
      max_docs: 200000
    - repo: OpenCoder-LLM/opc-sft-stage2
      name: evol_instruct
      split: train
      max_docs: 200000
    - repo: OpenCoder-LLM/opc-sft-stage2
      name: educational_instruct
      split: train
      max_docs: 100000
  instruction_field: instruction
  response_field: output
  seq_len: 2048
  val_fraction: 0.01
  max_val_docs: 1024
  streaming: true

optim:
  peak_lr: 1.0e-4
  min_lr_ratio: 0.1
  warmup_steps: 500
  weight_decay: 0.1
  b1: 0.9
  b2: 0.95
  grad_clip: 1.0
  router_bias_lr: 1.0e-3

train:
  batch_size: 16
  total_steps: 40
  seed: 0
  log_every: 50
  eval_every: 1000
  eval_batches: 50
  save_every: 1000
  keep_checkpoints: 3
  out_dir: runs/h200_sft
  tokenizer_path: runs/h200_pretrain/tokenizer.json
