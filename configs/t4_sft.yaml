# SFT (instruction tuning) on Kaggle "GPU T4 x2", data-parallel. Prompt-masked loss.
#
# Warm-start from the t4_pretrain run's WEIGHTS and REUSE its tokenizer, so the vocab
# and architecture match (required by --init-from):
#
#   python -m training.train --config configs/t4_sft.yaml --init-from runs/t4_pretrain
#
# The `model:` block below is IDENTICAL to configs/t4_pretrain.yaml — it must be, or
# the weight restore fails with a shape/structure mismatch. float32 (T4 has no
# hardware bf16); batch_size stays a multiple of the device count (2).

model:
  vocab_size: 32768 # overwritten by the loaded tokenizer (reused from pretrain)
  d_model: 512
  n_layers: 8
  full_attn_period: 4
  gdn_num_heads: 8
  gdn_head_k_dim: 64
  gdn_head_v_dim: 64
  gdn_chunk_size: 64
  gdn_conv_size: 4
  mla_num_q_heads: 8
  mla_num_kv_heads: 2
  mla_head_dim: 64
  max_seq_len: 1024
  moe_d_ff: 1024
  moe_n_routed: 8
  moe_n_shared: 1
  moe_top_k: 2
  compute_dtype: float32 # T4-safe (no hardware bf16)

data:
  task: sft
  sources:
    - repo: OpenCoder-LLM/opc-sft-stage1
      name: realuser_instruct
      split: train
      max_docs: 50000
    - repo: OpenCoder-LLM/opc-sft-stage2
      name: evol_instruct
      split: train
      max_docs: 50000
  instruction_field: instruction
  response_field: output
  seq_len: 1024
  val_fraction: 0.02
  max_val_docs: 512
  streaming: true

optim:
  peak_lr: 1.0e-4 # lower LR for fine-tuning than pretraining
  min_lr_ratio: 0.1
  warmup_steps: 100
  weight_decay: 0.1
  b1: 0.9
  b2: 0.95
  grad_clip: 1.0
  router_bias_lr: 1.0e-3

train:
  batch_size: 16 # 8 rows/GPU on 2x T4; keep a multiple of the device count
  total_steps: 2000
  seed: 0
  log_every: 20
  eval_every: 500
  eval_batches: 20
  save_every: 500
  keep_checkpoints: 3
  # On Kaggle, point these under /kaggle/working so they persist across the session.
  out_dir: runs/t4_sft
  # REUSE the pretrain tokenizer so the vocab matches the --init-from checkpoint.
  tokenizer_path: runs/t4_pretrain/tokenizer.json
